---
- name: Remove the autobuilt module, which would shadow kmod-beegfs
  file:
    path: "{{ beegfs_kernel_module }}"
    state: absent
  become: true
  when: beegfs_client_kmod | bool

- name: Install packages for BeeGFS client
  dnf:
    name: "{{ (beegfs_client_kmod_packages if beegfs_client_kmod | bool else ['beegfs-client']) + (['beegfs-helperd'] if beegfs_major_version is version('8', '<') else ['beegfs-tools']) + ['beegfs-utils'] }}"
    state: "{{ beegfs_package_action }}"
    allowerasing: true  # kmod-beegfs replaces beegfs-client
    disable_gpg_check: "{{ beegfs_client_kmod | bool and beegfs_client_kmod_packages | select('search', '\\.rpm$') | list | length > 0 }}"
  become: true
  notify: Restart BeeGFS client service

- name: Define client kernel build for IB
  lineinfile:
    path: "/etc/beegfs/beegfs-client-autobuild.conf"
    regexp: "^buildArgs="
    line: "{{ item.line }}"
  when: not beegfs_client_kmod | bool and item.condition
  with_items:
    - { line: "buildArgs=-j8 BEEGFS_OPENTK_IBVERBS=1", condition: "{{ beegfs_rdma | bool }}" }
    - { line: "buildArgs=-j8", condition: "{{ not beegfs_rdma | bool }}" }
  notify: Restart BeeGFS client service
  become: true

- name: Ensure kernel development headers are present
  package:
    name: "{{ beegfs_distro_vars[ansible_os_family]['kernel_dev_pkg'] }}-{{ ansible_kernel }}"
    state: present
  when: not beegfs_client_kmod | bool
  notify: Restart BeeGFS client service
  become: true

- name: Ensure gcc is installed
  package:
    name: "gcc"
    state: present
  when: not beegfs_client_kmod | bool
  become: true
  notify: Restart BeeGFS client service

- name: Rebuild the BeeGFS client kernel module
  command: /etc/init.d/beegfs-client rebuild
  args:
    creates: "{{ beegfs_kernel_module }}"
  when: not beegfs_client_kmod | bool
  become: true
  notify: Restart BeeGFS client service

- name: Label the autobuilt module for SELinux (7.x autobuild leaves it unlabeled)
  command: restorecon -R /lib/modules/{{ ansible_kernel }}/updates/fs/beegfs_autobuild
  changed_when: false  # restorecon is idempotent
  when: not beegfs_client_kmod | bool and ansible_selinux.status == 'enabled'
        and beegfs_major_version is version('8', '<')
  become: true

- name: Ensure the BeeGFS mount point exists
  file:
    path: "{{ client_path }}"
    state: directory
  become: true
  notify: Restart BeeGFS client service

- name: Copy over beegfs-mounts config file
  template:
    src: beegfs-mounts.conf.j2
    dest: /etc/beegfs/beegfs-mounts.conf
    mode: "0644"
  become: true
  notify: Restart BeeGFS client service

- name: Make of copy of BeeGFS client config file if it doesn't exist
  copy:
    remote_src: true
    src: /etc/beegfs/beegfs-client.conf
    dest: "/etc/beegfs/beegfs-client-{{ client_mgmt_host }}.conf"
    force: false
  become: true
  notify: Restart BeeGFS client service

- name: Configure beegfs-client config file to point to the specified management host
  lineinfile:
    dest: "/etc/beegfs/beegfs-client-{{ client_mgmt_host }}.conf"
    regexp: "^sysMgmtdHost"
    line: "sysMgmtdHost = {{ client_mgmt_host }}"
  become: true

- name: Configure beegfs-client config file to use the specified port
  vars:
    key: "{{ 'connClientPort' if beegfs_major_version is version('8', '>=') else 'connClientPortUDP' }}"  # renamed in 8.x
  lineinfile:
    dest: "/etc/beegfs/beegfs-client-{{ client_mgmt_host }}.conf"
    regexp: "^{{ key }}\\s*="
    line: "{{ key }} = {{ client_port }}"
  become: true

- name: Configure beegfs-client config file to ensure the specifed connection interface is used
  lineinfile:
    dest: "/etc/beegfs/beegfs-client-{{ client_mgmt_host }}.conf"
    regexp: "^connInterfacesFile"
    line: "connInterfacesFile = /etc/beegfs/connInterfacesFile"
  become: true

- name: Fetch the management service TLS certificate
  slurp:
    src: /etc/beegfs/cert.pem
  delegate_to: "{{ client_mgmt_host }}"
  become: true
  register: beegfs_mgmt_cert
  when: beegfs_major_version is version('8', '>=') and not beegfs_tls_disable | bool and client_mgmt_host != inventory_hostname

- name: Install the management service TLS certificate for the beegfs CLI
  copy:
    content: "{{ beegfs_mgmt_cert.content | b64decode }}"
    dest: /etc/beegfs/cert.pem
    mode: "0644"
  become: true
  when: beegfs_major_version is version('8', '>=') and not beegfs_tls_disable | bool and client_mgmt_host != inventory_hostname

- name: Copy default beegfs-client config file to enable beegfs_ctl in the management host
  copy:
    remote_src: true
    dest: /etc/beegfs/beegfs-client.conf
    src: "/etc/beegfs/beegfs-client-{{ client_mgmt_host }}.conf"
    force: true
  when: client_mgmt_host == inventory_hostname
  become: true

- name: Copy beegfs-client.service.d/ to /etc/systemd/system/
  copy:
    src: beegfs-client.service.d/
    dest: /etc/systemd/system/beegfs-client.service.d/
  notify: Restart BeeGFS client service
  become: true
...
