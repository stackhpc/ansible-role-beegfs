---
- name: Refuse to upgrade BeeGFS across major versions
  block:
    - name: Probe installed packages
      package_facts:
    - name: Ensure installed BeeGFS packages match beegfs_major_version
      vars:
        installed_majors: "{{ ansible_facts.packages | dict2items
                              | selectattr('key', 'match', '^(beegfs-|kmod-beegfs)')
                              | map(attribute='value') | flatten
                              | map(attribute='version') | map('regex_replace', '\\..*$', '')
                              | unique }}"
      assert:
        that: installed_majors | difference([beegfs_major_version]) | length == 0
        fail_msg: >-
          Installed BeeGFS major version(s) {{ installed_majors }} differ from
          beegfs_version {{ beegfs_version }}. Pin beegfs_version to the
          installed release (e.g. "7.4.6"), or upgrade across major versions
          manually following the upstream upgrade guide.

- name: Add BeeGFS repos is beegfs_add_repos is true
  block:

  - name: Remove the old unversioned BeeGFS repo file
    file:
      path: /etc/yum.repos.d/beegfs-rhel7.repo
      state: absent
    become: true

  - name: Ensure the BeeGFS package repo is defined
    get_url:
      url: "{{ beegfs_repo_url }}"
      dest: "{{ beegfs_repo_file }}"
      force: true  # pick up beegfs_version changes
    become: true

  - name: Load package repo key
    rpm_key:
      state: present
      key: "{{ beegfs_repo_key }}"
    become: true

  when: beegfs_add_repos | bool

# Task flow inspired by MichaelRigart.interfaces role - thanks markgoddard
- name: Ensure any required kernel modules are loaded
  modprobe:
    name: "{{ item }}"
    state: present
  become: true
  with_items: "{{ beegfs_kmod_preload }}"

- name: Make sure required modules are loaded at boot via /etc/modules-load.d
  lineinfile:
    dest: /etc/modules-load.d/beegfs.conf
    line: "{{ item }}"
    create: true
  become: true
  with_items: "{{ beegfs_kmod_preload }}"

- name: Stop and delete server and client service
  block:
    - name: Probe installed services
      service_facts:
    - name: Stop BeeGFS server and client services
      service:
        name: "{{ item.name }}"
        state: stopped
      when:
        - item.name in ansible_facts.services
        - item.enable | bool
      with_items:
        - { name: "beegfs-client.service", enable: "{{ beegfs_enable.client }}" }
        - { name: "beegfs-helperd.service", enable: "{{ beegfs_enable.client }}" }
        - { name: "beegfs-mgmtd.service", enable: "{{ beegfs_enable.mgmt }}" }
        - { name: "beegfs-meta.service", enable: "{{ beegfs_enable.meta }}" }
        - { name: "beegfs-admon.service", enable: "{{ beegfs_enable.admon }}" }
    - name: Stop BeeGFS storage services
      vars:
        service_name: "beegfs-storage@{{ item.port }}.service"
      service:
        name: "{{ service_name }}"
        state: stopped
      with_items: "{{ beegfs_oss }}"
      when: service_name in ansible_facts.services
    - name: Remove other beegfs folders
      file:
        path: "{{ item.name }}"
        state: absent
      when: item.enable | bool
      with_items:
        - { name: "{{ beegfs_meta_path }}", enable: "{{ beegfs_enable.meta }}" }
        - { name: "{{ beegfs_mgmt_path }}", enable: "{{ beegfs_enable.mgmt }}" }
        - { name: /var/lib/beegfs/mgmtd.sqlite, enable: "{{ beegfs_enable.mgmt and beegfs_major_version is version('8', '>=') }}" }
    - name: Unload kernel module
      modprobe:
        name: beegfs
        state: absent
    - name: Delete kernel module
      file:
        path: "{{ beegfs_kernel_module }}"
        state: absent
  when: (beegfs_force_format | bool) or
        (beegfs_package_action | lower == "latest")
  become: true

- include_tasks: rdma.yml
  when: beegfs_rdma | bool

- include_tasks: mgmt.yml
  when: beegfs_enable.mgmt | default(false) | bool

- include_tasks: admon.yml
  when: beegfs_enable.admon | default(false) | bool

- include_tasks: meta.yml
  when: beegfs_enable.meta | default(false) | bool

- include_tasks: oss.yml
  vars:
    oss_dev: "{{ oss_item.dev | default('') }}"
    oss_dev_is_defined: "{{ oss_item.dev is defined }}"
    oss_path: "{{ oss_item.path | default(beegfs_oss_path_prefix + oss_dev) }}"
    oss_port: "{{ oss_item.port }}"
    oss_replace: "{{ '-r' if (oss_item == beegfs_oss|first or beegfs_oss_multi_port) else '' }}"
  with_items: "{{ beegfs_oss }}"
  loop_control:
    loop_var: oss_item
  when: beegfs_enable.oss | default(false) | bool

- include_tasks: tuning.yml
  when: beegfs_enable.tuning | default(false) | bool

- include_tasks: client.yml
  vars:
    client_mgmt_host: "{{ client_item.mgmt_host | default(beegfs_mgmt_host) }}"
    client_path: "{{ client_item.path }}"
    client_port: "{{ client_item.port }}"
  with_items: "{{ beegfs_client }}"
  loop_control:
    loop_var: client_item
  when: beegfs_enable.client | default(false) | bool

- name: Create connInterfacesFile
  template:
    src: connInterfacesFile.j2
    dest: /etc/beegfs/connInterfacesFile
  become: true

- name: Write the connection authentication secret
  copy:
    content: "{{ beegfs_conn_auth_secret }}"
    dest: "{{ beegfs_conn_auth_file }}"
    mode: "0400"
  no_log: true
  become: true
  when: beegfs_conn_auth_secret | length > 0
  notify: Restart BeeGFS services

- name: Configure connection authentication in every BeeGFS config file
  lineinfile:
    path: "{{ item.0 }}"
    regexp: "^{{ item.1.key }}\\s*="
    line: "{{ item.1.key }} = {{ item.1.value }}"
  loop: "{{ conf_files | product(beegfs_conn_auth_lines | dict2items) | list }}"
  vars:
    # Config files of the services enabled on this host, concatenated:
    # - /etc/beegfs/beegfs-mgmtd.conf (7.x only; 8.x mgmtd is configured in TOML)
    # - /etc/beegfs/beegfs-meta.conf
    # - /etc/beegfs/<port>.d/beegfs-storage.conf for each beegfs_oss port
    # - /etc/beegfs/beegfs-client-<mgmt_host>.conf for each beegfs_client entry
    #   (mgmt_host defaults to beegfs_mgmt_host), plus beegfs-client.conf, the
    #   copy that beegfs-ctl reads on the mgmt host, and on 7.x beegfs-helperd.conf
    # Each disabled service contributes an empty list.
    conf_files: "{{ (['/etc/beegfs/beegfs-mgmtd.conf'] if beegfs_enable.mgmt | bool and beegfs_major_version is version('8', '<') else [])
                    + (['/etc/beegfs/beegfs-meta.conf'] if beegfs_enable.meta | bool else [])
                    + (beegfs_oss | map(attribute='port') | map('string') | map('regex_replace', '^', '/etc/beegfs/') | map('regex_replace', '$', '.d/beegfs-storage.conf') | list if beegfs_enable.oss | bool else [])
                    + (beegfs_client | map(attribute='mgmt_host', default=beegfs_mgmt_host) | map('regex_replace', '^(.*)$', '/etc/beegfs/beegfs-client-\\1.conf') | list + ['/etc/beegfs/beegfs-client.conf'] + (['/etc/beegfs/beegfs-helperd.conf'] if beegfs_major_version is version('8', '<') else []) if beegfs_enable.client | bool else []) }}"
  become: true
  notify: Restart BeeGFS services

# Restart services only once all their config, incl. connInterfacesFile and
# the auth secret, is in place.
- meta: flush_handlers

- name: Start and enable BeeGFS server services
  service:
    name: "{{ item.name }}"
    enabled: true
    state: "{{ item.state | default(omit) }}"
  become: true
  when: item.enable | bool
  with_items:
    - { name: beegfs-mgmtd, enable: "{{ beegfs_enable.mgmt }}", state: started }
    - { name: beegfs-meta, enable: "{{ beegfs_enable.meta }}", state: started }
    - { name: beegfs-admon, enable: "{{ beegfs_enable.admon }}", state: started }
    - { name: beegfs-oss-tuning, enable: "{{ beegfs_enable.tuning }}" }

- name: Start and enable BeeGFS storage services
  service:
    name: "beegfs-storage@{{ item.port }}"
    enabled: true
    state: started
  become: true
  when: beegfs_enable.oss | bool
  with_items: "{{ beegfs_oss }}"

- name: Start and enable BeeGFS client services
  service:
    name: "{{ item.name }}"
    enabled: true
    state: started
  become: true
  when: item.enable | bool
  with_items:
    - { name: beegfs-helperd, enable: "{{ beegfs_enable.client and beegfs_major_version is version('8', '<') }}" }
    - { name: beegfs-client, enable: "{{ beegfs_enable.client }}" }
  retries: 3
  delay: 3
  register: result
  until: result is success
...
