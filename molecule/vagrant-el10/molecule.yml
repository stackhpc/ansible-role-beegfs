---
# Single node, AlmaLinux 10, BeeGFS 8.4. Shared settings: .config/molecule/config.yml
platforms:
  - name: el10
    box: almalinux/10
    cpus: 2
    memory: 2048
    provider_raw_config_args:
      - "storage :file, :size => '20G'"
    config_options:
      synced_folder: false
    groups:
      - cluster_beegfs_mgmt
      - cluster_beegfs_mds
      - cluster_beegfs_oss
      - cluster_beegfs_client
provisioner:
  inventory:
    group_vars:
      all:
        beegfs_version: "8.4"
