---
# Multi-node cluster, BeeGFS 8.4: mgmt+meta, storage and client on separate
# hosts (exercises cross-host auth and TLS cert distribution). EL8 has its
# own scenario (older ansible-core). Shared settings: .config/molecule/config.yml
platforms:
  - name: node1
    box: almalinux/9
    cpus: 1
    memory: 2048
    config_options:
      synced_folder: false
    groups:
      - cluster_beegfs_mgmt
      - cluster_beegfs_mds
  - name: node2
    box: almalinux/10
    cpus: 1
    memory: 2048
    provider_raw_config_args:
      - "storage :file, :size => '20G'"
    config_options:
      synced_folder: false
    groups:
      - cluster_beegfs_oss
  - name: node3
    box: almalinux/10
    cpus: 1
    memory: 2048
    config_options:
      synced_folder: false
    groups:
      - cluster_beegfs_client
provisioner:
  inventory:
    group_vars:
      all:
        beegfs_version: "8.4"
